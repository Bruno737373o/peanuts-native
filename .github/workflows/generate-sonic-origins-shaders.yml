name: Generate Sonic Origins Shader Profile

on:
  workflow_dispatch:
    inputs:
      mediafire_url:
        description: 'Link do exefs.zip no MediaFire'
        required: true
        default: 'https://www.mediafire.com/file/dt27hi8h8hfwceg/exefs.zip/file?dkey=1y594zbo4m7&r=1701'

jobs:
  generate-shaders:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório Peanuts Native
        uses: actions/checkout@v4

      - name: Instalar dependências (Python e utilitários)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip python3 python3-pip binutils xxd file

      - name: Baixar exefs.zip do MediaFire
        env:
          MF_URL: ${{ github.event.inputs.mediafire_url }}
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          HTML=$(curl -sL -A "$UA" -c cookies.txt "$MF_URL")

          DIRECT_URL=$(echo "$HTML" | grep -oE 'https://download[0-9]+\.mediafire\.com/[^"'\'' ]+' | head -n 1)

          if [ -z "$DIRECT_URL" ]; then
            SCRAMBLED=$(echo "$HTML" | grep -oE 'data-scrambled-url="[^"]+"' | head -n 1 | cut -d'"' -f2)
            if [ -n "$SCRAMBLED" ]; then
              DIRECT_URL=$(echo "$SCRAMBLED" | base64 -d 2>/dev/null || true)
            fi
          fi

          if [ -z "$DIRECT_URL" ]; then
            echo "Erro: Não foi possível resolver o link direto do MediaFire."
            exit 1
          fi

          echo "Baixando de: $DIRECT_URL"
          curl -L -A "$UA" -b cookies.txt "$DIRECT_URL" -o exefs.zip

          file exefs.zip
          mkdir -p extracted_rom
          unzip -q exefs.zip -d extracted_rom/
          find extracted_rom/ -maxdepth 3

      - name: Gerar game.tsv completo
        env:
          DM_GAME: "01009FB016286000"
        run: |
          mkdir -p dm/games/01009FB016286000
          EXEFS_DIR=$(dirname "$(find extracted_rom -name "main" -type f | head -n 1)")
          echo "EXEFS_DIR=$EXEFS_DIR" >> $GITHUB_ENV

          BUILD_MODULES=""
          PRESENT_MODULES=""
          for mod in main subsdk0 subsdk1 subsdk2 sdk; do
            if [ -f "$EXEFS_DIR/$mod" ]; then
              HASH=$(xxd -p -c 16 -s 64 -l 16 "$EXEFS_DIR/$mod")
              BUILD_MODULES="$BUILD_MODULES $mod=$HASH"
              PRESENT_MODULES="$PRESENT_MODULES $mod"
            fi
          done
          BUILD_MODULES=$(echo "$BUILD_MODULES" | xargs)
          PRESENT_MODULES=$(echo "$PRESENT_MODULES" | xargs)

          cat << EOF > dm/games/01009FB016286000/game.tsv
          title_id	01009FB016286000
          program_id	01009FB016286000
          name	Sonic Origins
          ipa	SonicOrigins.ipa
          app_category	public.app-category.action-games
          pad_layout	full
          build	v458752	2.0.2	$BUILD_MODULES
          package	v458752
          shader_versions	v458752
          modules	$PRESENT_MODULES
          romfs_marker	Data.rsdk
          zip_store	.rsdk:.pak:.pac:.usm:.acb:.awb:.bnk:.metallib
          mem_reserve	0x100000000
          mem_alias	0x10000000
          mem_stack	0x10000000
          app_pool	0xCD500000
          mem_used	0x4000000
          shader_groups	/=shaders
          shader_note	Sonic Origins NVN shaders (main / RomFS UI & RSDKv5U)
          EOF

          echo "=== game.tsv gerado ==="
          cat dm/games/01009FB016286000/game.tsv

      - name: Ler argumentos do shader_split.py e gerar arquivos TSV
        env:
          DM_GAME: "01009FB016286000"
        run: |
          echo "=== Final do shader_split.py (CLI / sys.argv) ==="
          tail -n 60 dm/gfx/tools/shader_split.py

          mkdir -p work_shaders
          DUMP_ROOT=$(dirname "$EXEFS_DIR")
          python3 dm/gfx/tools/shader_split.py "$DUMP_ROOT" work_shaders || true

          echo "=== Arquivos gerados em dm/games/01009FB016286000/ e work_shaders/ ==="
          ls -la dm/games/01009FB016286000/
          ls -la work_shaders/

      - name: Publicar Artifact com o perfil de shaders
        uses: actions/upload-artifact@v4
        with:
          name: sonic-origins-01009FB016286000-shaders
          path: |
            dm/games/01009FB016286000/*
            work_shaders/*
